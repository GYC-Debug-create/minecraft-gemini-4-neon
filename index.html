<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%235d8a47'/%3E%3Crect y='5' width='16' height='11' fill='%237d5a3c'/%3E%3Crect x='2' y='5' width='3' height='2' fill='%235d8a47'/%3E%3Crect x='10' y='5' width='4' height='3' fill='%235d8a47'/%3E%3Crect x='6' y='9' width='4' height='4' fill='%2345c8b8'/%3E%3C/svg%3E" />
    <title>Stoneroot — Voxel Survival Sandbox</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #14181e;
        color: #f0ebe1;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      #game-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
